# Cluster-specific example, intentionally not included by kustomization.yaml.
# Adapt ingress-controller / Prometheus namespace labels before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress
  namespace: telemetryforge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: telemetryforge-dashboard
      ports:
        - protocol: TCP
          port: 8080
