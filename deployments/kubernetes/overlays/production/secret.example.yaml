# Example only. Do not commit real values.
#
# 1. Generate a strong random dashboard key.
# 2. Put only its SHA-256 digest in the api-keys.json document.
# 3. Put the raw key only in telemetryforge-dashboard-auth.
# 4. Use your organization's external secret manager in real production.

apiVersion: v1
kind: Secret
metadata:
  name: telemetryforge-api-keys
  namespace: telemetryforge
type: Opaque
stringData:
  api-keys.json: |
    {
      "keys": [
        {
          "name": "dashboard-read",
          "sha256": "REPLACE_WITH_SHA256_OF_DASHBOARD_KEY",
          "tenant_id": "production",
          "scopes": ["read"]
        },
        {
          "name": "ingest-client",
          "sha256": "REPLACE_WITH_SHA256_OF_INGEST_KEY",
          "tenant_id": "production",
          "scopes": ["ingest"]
        },
        {
          "name": "prometheus-admin",
          "sha256": "REPLACE_WITH_SHA256_OF_ADMIN_KEY",
          "tenant_id": "production",
          "scopes": ["admin"]
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: telemetryforge-dashboard-auth
  namespace: telemetryforge
type: Opaque
stringData:
  api-key: "REPLACE_WITH_RAW_DASHBOARD_KEY"

---
apiVersion: v1
kind: Secret
metadata:
  name: telemetryforge-secrets
  namespace: telemetryforge
type: Opaque
stringData:
  TELEMETRYFORGE_DATABASE_URL: "postgres://USER:PASSWORD@timescaledb.example.internal:5432/telemetryforge?sslmode=require"
  TELEMETRYFORGE_KAFKA_SASL_USERNAME: "REPLACE_WITH_KAFKA_USERNAME"
  TELEMETRYFORGE_KAFKA_SASL_PASSWORD: "REPLACE_WITH_KAFKA_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: telemetryforge-prometheus-auth
  namespace: telemetryforge
type: Opaque
stringData:
  api-key: "REPLACE_WITH_RAW_ADMIN_KEY_MATCHING_prometheus-admin_HASH"
