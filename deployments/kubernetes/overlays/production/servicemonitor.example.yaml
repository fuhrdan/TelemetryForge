# Optional Prometheus Operator example; not included by kustomization.yaml.
#
# The production gateway/worker protect /metrics with admin scope. Create a
# Secret containing a raw admin API key and reference it from your Prometheus
# Operator resource. Adapt labels/namespaces to your cluster.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telemetryforge-gateway
  namespace: telemetryforge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      authorization:
        type: Bearer
        credentials:
          name: telemetryforge-prometheus-auth
          key: api-key
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telemetryforge-worker
  namespace: telemetryforge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-worker
  endpoints:
    - port: admin
      path: /metrics
      interval: 15s
      authorization:
        type: Bearer
        credentials:
          name: telemetryforge-prometheus-auth
          key: api-key
