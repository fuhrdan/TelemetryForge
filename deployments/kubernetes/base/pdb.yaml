apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: telemetryforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: telemetryforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dashboard
  namespace: telemetryforge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-dashboard
