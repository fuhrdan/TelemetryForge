# Copy this file to secret.yaml, replace the development placeholder, and keep
# secret.yaml out of Git. Production should normally use External Secrets,
# Sealed Secrets, a cloud secret manager, or another organization-approved
# mechanism rather than committing Kubernetes Secret values.
apiVersion: v1
kind: Secret
metadata:
  name: telemetryforge-secrets
  namespace: telemetryforge
type: Opaque
stringData:
  TELEMETRYFORGE_DATABASE_URL: "postgres://USER:PASSWORD@timescaledb.example.internal:5432/telemetryforge?sslmode=require"
