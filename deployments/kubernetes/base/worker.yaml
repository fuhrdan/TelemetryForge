apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: telemetryforge
spec:
  # Local topics currently use six partitions. More than six active consumer
  # replicas for one six-partition topic do not create additional group-level
  # concurrency.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetryforge-worker
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8081"
      labels:
        app.kubernetes.io/name: telemetryforge-worker
        app.kubernetes.io/part-of: telemetryforge
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: ghcr.io/fuhrdan/telemetryforge:v1.2.0
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/telemetryforge-worker"]
          ports:
            - name: admin
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: telemetryforge-config
            - secretRef:
                name: telemetryforge-secrets
          volumeMounts:
            - name: policies
              mountPath: /etc/telemetryforge/policies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: policies
          configMap:
            name: telemetryforge-policies

---
apiVersion: v1
kind: Service
metadata:
  name: worker-admin
  namespace: telemetryforge
  labels:
    app.kubernetes.io/name: telemetryforge-worker
spec:
  selector:
    app.kubernetes.io/name: telemetryforge-worker
  ports:
    - name: admin
      port: 8081
      targetPort: admin
