apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetryforge-config
  namespace: telemetryforge
data:
  TELEMETRYFORGE_ADDRESS: ":8080"
  TELEMETRYFORGE_EDGE_ADDRESS: ":8083"
  TELEMETRYFORGE_EDGE_WAL_DIR: "/var/lib/telemetryforge/wal"
  TELEMETRYFORGE_EDGE_REPLICA_DIR: "/var/lib/telemetryforge/wal/replicas"
  TELEMETRYFORGE_EDGE_REPLICA_MAX_BYTES: "8589934592"
  TELEMETRYFORGE_EDGE_DURABILITY_MODE: "local"
  TELEMETRYFORGE_EDGE_REPLICATION_QUORUM: "1"
  TELEMETRYFORGE_EDGE_REPLICATION_TIMEOUT: "3s"
  TELEMETRYFORGE_EDGE_WAL_SEGMENT_BYTES: "67108864"
  TELEMETRYFORGE_EDGE_WAL_MAX_BYTES: "4294967296"
  TELEMETRYFORGE_EDGE_REPLAY_BATCH_SIZE: "64"
  TELEMETRYFORGE_EBPF_ENABLED: "false"
  TELEMETRYFORGE_EBPF_REQUIRED: "false"
  TELEMETRYFORGE_EBPF_POLL_INTERVAL: "5s"
  TELEMETRYFORGE_EBPF_SIGNALS: "process_exec,socket_connect,tcp_retransmit"
  TELEMETRYFORGE_EBPF_TRACEFS_ROOT: ""
  TELEMETRYFORGE_EBPF_TENANT_ID: "default"
  TELEMETRYFORGE_MESH_POLICY: "locality"
  TELEMETRYFORGE_MESH_PEERS: ""
  TELEMETRYFORGE_MESH_PROBE_INTERVAL: "5s"
  TELEMETRYFORGE_MESH_TIMEOUT: "2s"
  TELEMETRYFORGE_MESH_STALE_AFTER: "15s"
  TELEMETRYFORGE_MESH_MAX_PRESSURE: "0.90"
  TELEMETRYFORGE_MESH_DRAINING: "false"
  TELEMETRYFORGE_KAFKA_BROKERS: "kafka.example.internal:9092"
  TELEMETRYFORGE_KAFKA_CLIENT_ID: "telemetryforge-gateway"
  TELEMETRYFORGE_KAFKA_RAW_TOPIC: "telemetry.raw"
  TELEMETRYFORGE_KAFKA_METRIC_TOPIC: "telemetry.metrics"
  TELEMETRYFORGE_WORKER_CLIENT_ID: "telemetryforge-worker"
  TELEMETRYFORGE_WORKER_GROUP_ID: "telemetryforge-processors"
  TELEMETRYFORGE_WORKER_TOPICS: "telemetry.raw,telemetry.metrics"
  TELEMETRYFORGE_WORKER_DLQ_TOPIC: "telemetry.dlq"
  TELEMETRYFORGE_WORKER_COUNT: "4"
  TELEMETRYFORGE_WORKER_QUEUE_CAPACITY: "256"
  TELEMETRYFORGE_WORKER_ADMIN_ADDRESS: ":8081"
  TELEMETRYFORGE_INCIDENT_LATENCY_MS: "1000"
  TELEMETRYFORGE_INCIDENT_ERROR_COUNT: "5"
  TELEMETRYFORGE_POLICY_FILE: "/etc/telemetryforge/policies/active.json"
  TELEMETRYFORGE_SHADOW_POLICY_FILE: "/etc/telemetryforge/policies/shadow.json"
  TELEMETRYFORGE_ROUTING_FILE: "/etc/telemetryforge/routing/active.json"
  TELEMETRYFORGE_SHADOW_ROUTING_FILE: "/etc/telemetryforge/routing/shadow.json"
  TELEMETRYFORGE_SHAPING_FILE: "/etc/telemetryforge/shaping/active.json"
  TELEMETRYFORGE_SHADOW_SHAPING_FILE: "/etc/telemetryforge/shaping/shadow.json"
  TELEMETRYFORGE_ROUTER_ADMIN_ADDRESS: ":8082"
  TELEMETRYFORGE_CARDINALITY_MAX_DIMENSIONS: "20000"
  TELEMETRYFORGE_SCHEMA_FAIL_OPEN: "true"
  TELEMETRYFORGE_OTLP_TRACES_ENDPOINT: ""
  TELEMETRYFORGE_AUTH_MODE: "disabled"
  TELEMETRYFORGE_DEFAULT_TENANT: "default"
  TELEMETRYFORGE_REDACT_TAG_KEYS: "authorization,cookie,email,user_email,token,password,api_key"
  TELEMETRYFORGE_REDACT_PAYLOAD: "false"
  TELEMETRYFORGE_KAFKA_TLS: "false"
  TELEMETRYFORGE_KAFKA_SASL_MECHANISM: "disabled"
