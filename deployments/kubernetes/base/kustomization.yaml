apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telemetryforge

resources:
  - namespace.yaml
  - configmap.yaml
  - gateway.yaml
  - worker.yaml
  - dashboard.yaml
  - autoscaling.yaml
  - pdb.yaml

configMapGenerator:
  - name: telemetryforge-policies
    files:
      - active.json=policies/active.json
      - shadow.json=policies/shadow.json

generatorOptions:
  disableNameSuffixHash: true
