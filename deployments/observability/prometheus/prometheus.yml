global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: telemetryforge-gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics

  - job_name: telemetryforge-worker
    static_configs:
      - targets: ["worker:8081"]
    metrics_path: /metrics

  - job_name: telemetryforge-router
    static_configs:
      - targets: ["router:8082"]
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
