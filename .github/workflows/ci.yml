name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Format check
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...

  kafka-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Start Kafka
        run: docker compose up -d kafka kafka-init
      - name: Run Kafka integration test
        env:
          TELEMETRYFORGE_INTEGRATION_KAFKA_BROKERS: localhost:9092
        run: go test -count=1 ./tests/integration
      - name: Show Kafka logs on failure
        if: failure()
        run: docker compose logs kafka

  storage-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Start TimescaleDB
        run: docker compose up -d --wait timescaledb
      - name: Apply database migrations
        run: docker compose run --rm db-migrate
      - name: Run storage integration test
        env:
          TELEMETRYFORGE_INTEGRATION_DATABASE_URL: postgres://telemetryforge:telemetryforge@localhost:5432/telemetryforge?sslmode=disable
        run: go test -count=1 ./tests/integration
      - name: Show TimescaleDB logs on failure
        if: failure()
        run: docker compose logs timescaledb


  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build dashboard
        env:
          TELEMETRYFORGE_API_BASE: http://gateway:8080
        run: npm run build


  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -t telemetryforge:${{ github.sha }} .
      - name: Build dashboard container
        run: docker build -t telemetryforge-dashboard:${{ github.sha }} ./dashboard
