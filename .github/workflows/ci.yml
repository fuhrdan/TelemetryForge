name: CI

on:
  push:
    branches: ["main", "v2.5.0"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation and repository references
        run: python3 scripts/check-docs.py
      - name: Check whitespace
        run: git diff --check
      - name: Validate API key example
        run: python3 -m json.tool security/api-keys.example.json >/dev/null
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Format check
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build ./...
      - name: Validate active policy
        run: go run ./cmd/telemetryctl policy validate --file policies/active.json
      - name: Validate shadow policy
        run: go run ./cmd/telemetryctl policy validate --file policies/shadow.json
      - name: Validate active routing
        run: go run ./cmd/telemetryctl routing validate --file routing/active.json
      - name: Validate shadow routing
        run: go run ./cmd/telemetryctl routing validate --file routing/shadow.json
      - name: Validate Connector Platform routing example
        run: go run ./cmd/telemetryctl connector validate --file routing/connectors.example.json
      - name: Connector protocol tests
        run: go test ./internal/connectors ./internal/router
      - name: Operational proof model tests
        run: go test ./internal/proof
      - name: Replicated durable edge and mesh tests
        run: go test ./internal/lineage ./internal/wal ./internal/replication ./internal/mesh ./internal/edge
      - name: Bounded formal protocol models
        run: |
          go test ./internal/formal
          go run ./cmd/formalcheck --output /tmp/telemetryforge-formal-check.json
      - name: Fuzz formal protocol schedules
        run: go test -run=^$ -fuzz=FuzzProtocolActions -fuzztime=5s ./internal/formal
      - name: Validate connector-outage proof routing fixture
        run: go run ./cmd/telemetryctl routing validate --file routing/proof-connector-outage.json
      - name: Validate proof Python helpers
        run: python3 -m py_compile scripts/proof_common.py scripts/run-proof.py scripts/run-benchmark.py scripts/proof-db-restore.py scripts/proof-k8s-rollout.py

  formal-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Run dependency-free bounded checker
        run: |
          go test -race ./internal/formal
          go run ./cmd/formalcheck --output /tmp/telemetryforge-formal-check.json
      - name: Download pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat formal/tla2tools.version)
          curl -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/tlaplus/tlaplus/releases/download/v${version}/tla2tools.jar" \
            -o /tmp/tla2tools.jar
          expected=$(cat formal/tla2tools.sha256)
          echo "${expected}  /tmp/tla2tools.jar" | sha256sum -c -
      - name: Model-check TLA+ safety specifications
        env:
          TLA2TOOLS_JAR: /tmp/tla2tools.jar
        run: scripts/run-tlc.sh

  kafka-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Start Kafka
        run: docker compose up -d --wait kafka kafka-init
      - name: Run Kafka integration tests
        env:
          TELEMETRYFORGE_INTEGRATION_KAFKA_BROKERS: localhost:9092
        run: go test -count=1 ./tests/integration
      - name: Show Kafka logs on failure
        if: failure()
        run: docker compose logs kafka kafka-init

  storage-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true
      - name: Start TimescaleDB
        run: docker compose up -d --wait timescaledb
      - name: Apply database migrations
        run: docker compose run --rm db-migrate
      - name: Run storage integration tests
        env:
          TELEMETRYFORGE_INTEGRATION_DATABASE_URL: postgres://telemetryforge:telemetryforge@localhost:5432/telemetryforge?sslmode=disable
        run: go test -count=1 ./tests/integration
      - name: Show TimescaleDB logs on failure
        if: failure()
        run: docker compose logs timescaledb db-migrate

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build dashboard
        env:
          TELEMETRYFORGE_API_BASE: http://gateway:8080
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v5
        with:
          version: "v1.37.0"
      - name: Render Kubernetes manifests
        run: kubectl kustomize deployments/kubernetes/base > /tmp/telemetryforge-k8s.yaml
      - name: Parse Kubernetes manifests
        run: kubectl apply --dry-run=client --validate=false -f /tmp/telemetryforge-k8s.yaml
      - name: Render production Kubernetes overlay
        run: kubectl kustomize deployments/kubernetes/overlays/production > /tmp/telemetryforge-production.yaml
      - name: Parse production Kubernetes overlay
        run: kubectl apply --dry-run=client --validate=false -f /tmp/telemetryforge-production.yaml
      - name: Parse production secret example
        run: kubectl apply --dry-run=client --validate=false -f deployments/kubernetes/overlays/production/secret.example.yaml
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - name: Terraform format
        run: terraform -chdir=infra/terraform/aws fmt -check
      - name: Terraform init
        run: terraform -chdir=infra/terraform/aws init -backend=false -input=false
      - name: Terraform validate
        run: terraform -chdir=infra/terraform/aws validate



  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Prometheus configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/deployments/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.3 \
            check config /etc/prometheus/prometheus.yml
      - name: Validate OpenTelemetry Collector configuration
        run: |
          docker run --rm \
            -v "$PWD/deployments/observability/otel/collector.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector:0.160.0 \
            validate --config=/etc/otelcol/config.yaml
      - name: Validate Tempo configuration
        run: |
          docker run --rm \
            -v "$PWD/deployments/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro" \
            grafana/tempo:3.0.2 \
            -config.file=/etc/tempo/tempo.yaml -config.verify
      - name: Validate Grafana dashboard JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path("deployments/observability/grafana/dashboards").glob("*.json"):
              json.loads(path.read_text())
              print(f"validated {path}")
          PY

  load-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect k6 smoke scenario
        run: docker run --rm -v "$PWD/load/k6:/scripts:ro" grafana/k6:2.2.0 inspect /scripts/ingest-smoke.js
      - name: Inspect k6 sustained scenario
        run: docker run --rm -v "$PWD/load/k6:/scripts:ro" grafana/k6:2.2.0 inspect /scripts/ingest-sustained.js
      - name: Inspect k6 backpressure scenario
        run: docker run --rm -v "$PWD/load/k6:/scripts:ro" grafana/k6:2.2.0 inspect /scripts/backpressure.js

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend container
        run: docker build -t telemetryforge:${{ github.sha }} .
      - name: Build dashboard container
        run: docker build -t telemetryforge-dashboard:${{ github.sha }} ./dashboard
