services:
  timescaledb:
    image: timescale/timescaledb:2.30.0-pg17
    hostname: timescaledb
    container_name: telemetryforge-timescaledb
    environment:
      POSTGRES_DB: telemetryforge
      POSTGRES_USER: telemetryforge
      POSTGRES_PASSWORD: telemetryforge
    ports:
      - "5432:5432"
    volumes:
      - telemetryforge-db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetryforge -d telemetryforge"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  db-migrate:
    image: timescale/timescaledb:2.30.0-pg17
    environment:
      PGPASSWORD: telemetryforge
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        for migration in /migrations/*.sql; do
          echo "Applying $${migration}"
          psql -h timescaledb -U telemetryforge -d telemetryforge -v ON_ERROR_STOP=1 -f "$${migration}"
        done

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: telemetryforge-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.raw --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.metrics --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.dlq --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.replay --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.routed.primary --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.routed.security --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic telemetry.routed.archive --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.raw
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.metrics
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.dlq
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.replay
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.routed.primary
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.routed.security
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic telemetry.routed.archive


  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TELEMETRYFORGE_ADDRESS: ":8080"
      TELEMETRYFORGE_KAFKA_BROKERS: "kafka:19092"
      TELEMETRYFORGE_KAFKA_CLIENT_ID: "telemetryforge-gateway"
      TELEMETRYFORGE_KAFKA_RAW_TOPIC: "telemetry.raw"
      TELEMETRYFORGE_KAFKA_METRIC_TOPIC: "telemetry.metrics"
      TELEMETRYFORGE_DATABASE_URL: "postgres://telemetryforge:telemetryforge@timescaledb:5432/telemetryforge?sslmode=disable"
      TELEMETRYFORGE_AUTH_MODE: "disabled"
      TELEMETRYFORGE_DEFAULT_TENANT: "default"
      TELEMETRYFORGE_REDACT_PAYLOAD: "false"
      TELEMETRYFORGE_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped


  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/telemetryforge-worker"]
    environment:
      TELEMETRYFORGE_KAFKA_BROKERS: "kafka:19092"
      TELEMETRYFORGE_WORKER_CLIENT_ID: "telemetryforge-worker"
      TELEMETRYFORGE_WORKER_GROUP_ID: "telemetryforge-processors"
      TELEMETRYFORGE_WORKER_TOPICS: "telemetry.raw,telemetry.metrics"
      TELEMETRYFORGE_WORKER_COUNT: "4"
      TELEMETRYFORGE_WORKER_QUEUE_CAPACITY: "256"
      TELEMETRYFORGE_WORKER_DLQ_TOPIC: "telemetry.dlq"
      TELEMETRYFORGE_WORKER_ADMIN_ADDRESS: ":8081"
      TELEMETRYFORGE_POLICY_FILE: "/etc/telemetryforge/policies/active.json"
      TELEMETRYFORGE_SHADOW_POLICY_FILE: "/etc/telemetryforge/policies/shadow.json"
      TELEMETRYFORGE_ROUTING_FILE: "/etc/telemetryforge/routing/active.json"
      TELEMETRYFORGE_SHADOW_ROUTING_FILE: "/etc/telemetryforge/routing/shadow.json"
      TELEMETRYFORGE_SHAPING_FILE: "/etc/telemetryforge/shaping/active.json"
      TELEMETRYFORGE_SHADOW_SHAPING_FILE: "/etc/telemetryforge/shaping/shadow.json"
      TELEMETRYFORGE_CARDINALITY_MAX_DIMENSIONS: "20000"
      TELEMETRYFORGE_SCHEMA_FAIL_OPEN: "true"
      TELEMETRYFORGE_INCIDENT_LATENCY_MS: "1000"
      TELEMETRYFORGE_INCIDENT_ERROR_COUNT: "5"
      TELEMETRYFORGE_DATABASE_URL: "postgres://telemetryforge:telemetryforge@timescaledb:5432/telemetryforge?sslmode=disable"
      TELEMETRYFORGE_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
    volumes:
      - ./policies:/etc/telemetryforge/policies:ro
      - ./routing:/etc/telemetryforge/routing:ro
      - ./shaping:/etc/telemetryforge/shaping:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    stop_grace_period: 45s
    restart: unless-stopped


  router:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/telemetryforge-router"]
    environment:
      TELEMETRYFORGE_KAFKA_BROKERS: "kafka:19092"
      TELEMETRYFORGE_DATABASE_URL: "postgres://telemetryforge:telemetryforge@timescaledb:5432/telemetryforge?sslmode=disable"
      TELEMETRYFORGE_ROUTING_FILE: "/etc/telemetryforge/routing/active.json"
      TELEMETRYFORGE_ROUTER_ADMIN_ADDRESS: ":8082"
      TELEMETRYFORGE_AUTH_MODE: "disabled"
      TELEMETRYFORGE_OTLP_TRACES_ENDPOINT: "http://otel-collector:4318/v1/traces"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped


  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    environment:
      TELEMETRYFORGE_API_BASE: "http://gateway:8080"
      TELEMETRYFORGE_DASHBOARD_API_KEY: ""
    ports:
      - "3000:3000"
    depends_on:
      gateway:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped


  otel-collector:
    image: otel/opentelemetry-collector:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deployments/observability/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: "0"
    volumes:
      - ./deployments/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - telemetryforge-tempo:/var/tempo
    ports:
      - "3200:3200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./deployments/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - telemetryforge-prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      gateway:
        condition: service_healthy
      worker:
        condition: service_healthy
      router:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: telemetryforge
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deployments/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - telemetryforge-grafana:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  telemetryforge-db:
  telemetryforge-prometheus:
  telemetryforge-grafana:
  telemetryforge-tempo:
